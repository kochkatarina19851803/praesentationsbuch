name: Android-App erstellen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"



      - name: Android SDK installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erstellen
        run: npx cap add android

      - name: App-Dateien übernehmen
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Praesentationsbuch-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
